<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--br:#d9dde3;--ac:#0f766e;--dg:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1e2328;--tx:#e8eaed;--mu:#9aa3ad;--br:#343b43;--ac:#2dd4bf;--dg:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Noto Sans Bengali",sans-serif}
header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px;text-align:center;background:var(--card);border-bottom:1px solid var(--br)}
.logo{height:70px;width:auto}header h1{margin:0;font-size:17px}header p{margin:2px 0 0;color:var(--mu);font-size:12px}
button{border:1px solid var(--br);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dg{color:var(--dg)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);position:sticky;top:0;z-index:40}.topbar b{font-size:15px}.sp{flex:1}
#drawer{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82vw;background:var(--card);border-right:1px solid var(--br);z-index:60;transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;padding:12px;gap:6px;overflow-y:auto}
#drawer.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.25)}
#drawer .dh{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
#drawer .mi{text-align:left;border:0;background:none;padding:12px;border-radius:10px;font-size:15px;width:100%}#drawer .mi:hover{background:var(--bg)}
.dbk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}.dbk.open{opacity:1;pointer-events:auto}
main{padding:0 10px 24px}
.wrap{overflow-x:auto;border:1px solid var(--br);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;min-width:1500px;width:100%}th,td{border-bottom:1px solid var(--br);padding:4px;white-space:nowrap}
th{background:var(--bg);font-size:12px;text-align:left}td.ro{font-weight:600;padding:4px 10px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.fa{display:flex;gap:8px;margin-top:12px}
.f,label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);min-width:0}
.in{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--br);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.in.ro{border-style:dashed;background:transparent;font-weight:600;display:flex;align-items:center}
td .in{min-width:110px;min-height:0;padding:7px 9px;border-radius:10px}
.dd{position:relative;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px}
.dd:after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mu)}.dd.ph{color:var(--mu)}
.ddp{position:fixed;z-index:70;background:var(--card);border:1px solid var(--br);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:6px}
.ddh{display:flex;gap:6px;margin-bottom:6px}.ddh input{flex:1;min-width:0;font-size:16px;padding:8px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx)}
#ddl{max-height:240px;overflow-y:auto}.ddi{padding:10px 8px;border-radius:8px;cursor:pointer}.ddi:hover{background:var(--bg)}.ddn{padding:8px;color:var(--mu)}
@media (max-width:699px){#ddl{max-height:28vh}}
.add{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}.add .in{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--br)}.item button{border:0;background:none;color:var(--dg);font-size:16px;padding:0 6px}
.login{max-width:340px;margin:40px auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:14px}
.hide{display:none!important}#msg{padding:10px 12px;color:var(--dg);font-size:14px;font-weight:600}
#vsum.t-rec .cout,#vsum.t-out .crec{display:none}
@page{size:A4 landscape;margin:8mm}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--br:#999;--mu:#444}body{font-size:9px}.topbar,#drawer,#dbk,.noprint,.sctl,#fp,#msg,.ddp,header p:last-child{display:none!important}.wrap{overflow:visible;border:0}table{min-width:0!important;width:100%}th,td{white-space:normal!important;padding:2px 3px;font-size:8px;word-break:break-word}th{background:#eee!important}h3{margin:8px 0 4px!important}.card{border:0;padding:0}}

/* ---- legacy-safe value getters ---- */
function ovv(r){return r.ov!==undefined&&r.ov!==""?num(r.ov):num(r.open)*num(r.price)}
function cvv(r){return r.cv!==undefined&&r.cv!==""?num(r.cv):num(r.close)*num(r.price)}
function rvv(r){return r.rv!==undefined?num(r.rv):num(r.rec)*num(r.price)}
function outvv(r){return r.outv!==undefined?num(r.outv):num(r.out)*num(r.price)}
function oupv(r){return num(r.open)>0?ovv(r)/num(r.open):0}
function cupv(r){return num(r.close)>0?cvv(r)/num(r.close):0}

 var n=Date.now(),sref=db.collection("stock").doc(sid(d.prod)),rref=db.collection("rows").doc("r"+n);

  t.set(rref,r);t.set(sref,{prod:d.prod,qty:r.close,val:r.cv})})}).then(function(){pf=d.date;pt=d.date;draft=newDraft();renderEntry();renderPrev()}).catch(fail)}

 var h=list.map(function(p){var r=p[0];return "<tr><td class='ro'>"+(p[1]+1)+"</td>"+C.slice(1).map(function(c){var v=val(r,c[0]);v=(c[0]=="oup"||c[0]=="cup")?ra(v):MONEY[c[0]]?f2(v):(c[0]=="open"||c[0]=="close"||c[0]=="rec"||c[0]=="out")?q3(v):v;return "<td class='ro' style='font-weight:400'>"+esc(v)+(c[0]=="rec"&&r.ret?" (Return)":"")+"</td>"}).join("")+"</tr>"}).join("");
 var io=0,ic=0;C.forEach(function(c,i){if(c[0]=="ov")io=i;if(c[0]=="cv")ic=i});
 if(h)h+="<tr><td colspan='"+io+"' style='text-align:right;font-weight:700;padding:6px 10px'>Total Value</td><td class='ro'>"+f2(so)+"</td><td colspan='"+(ic-io-1)+"'></td><td class='ro'>"+f2(sc)+"</td></tr>";
 $("ptb").innerHTML=h||"<tr><td colspan='"+C.length+"' style='padding:14px;color:var(--mu)'>No records for this date</td></tr>"}
function render(){renderPrev();if(curV=="reg"&&!($("ef").contains(document.activeElement)))renderEntry();renderAE();if(curV=="ret")renderRetPrev()}
/* ---- Summary ---- */
function prepSum(){var names=[];["prod","person","desig","dept"].forEach(function(k){names=names.concat(lists[k]);rows.forEach(function(r){if(r[k])names.push(r[k])})});
 $("dl_item").innerHTML=names.filter(function(x,i){return x&&names.indexOf(x)===i}).map(function(x){return "<option value='"+esc(x)+"'>"}).join("");
 if(!$("sd1").value)$("sd1").value=today();if(!$("sd2").value)$("sd2").value=today()}
function okSum(){var d=rng("sd1","sd2");if(!d)return;var ty=$("sty").value,pn=$("spn").dataset.v||"",iv=$("sit").value.trim(),it=iv.toLowerCase(),g={},ord=[],tot=0;
 $("vsum").classList.toggle("t-rec",ty=="rec");$("vsum").classList.toggle("t-out",ty=="out");
 rows.forEach(function(r){if(r.date<d[0]||r.date>d[1])return;var q=num(r[ty]);if(q<=0)return;if(pn&&r.person!==pn)return;
  if(it&&![r.prod,r.person,r.desig,r.dept].some(function(x){return String(x||"").toLowerCase().indexOf(it)>=0}))return;
  var key=[r.date,r.prod,r.person,r.dept,r.desig].join("|");
  if(!g[key]){g[key]={date:r.date,cat:r.cat,prod:r.prod,spc:r.spc,person:r.person,dept:r.dept,desig:r.desig,rec:0,out:0,val:0};ord.push(key)}
  var o=g[key];o[ty]+=q;o.val+=(ty=="rec"?rvv(r):outvv(r))});
 $("sh").textContent="Summary — "+(ty=="rec"?"Received":"Out")+" — "+(pn||"All Persons")+" — "+(iv||"All Items")+" ("+(d[0]===d[1]?d[0]:d[0]+" to "+d[1])+")";
 var H=[["SL No",""],["Date",""],["Catagory",""],["Products Name",""],["SPC",""],["Received","crec"],["Out","cout"],["Person Name",""],["Designation",""],["Department",""],["Unit Price",""],["Total Value",""]];
 $("sth").innerHTML="<tr>"+H.map(function(x){return "<th class='"+x[1]+"'>"+x[0]+"</th>"}).join("")+"</tr>";
 var n=0,h=ord.map(function(k){var o=g[k],q=o[ty];tot+=o.val;n++;
  return "<tr><td class='ro'>"+n+"</td>"+["date","cat","prod","spc","rec","out","person","desig","dept"].map(function(f){var v=o[f];if(f=="rec"||f=="out")v=q3(v);return "<td class='ro "+(f=="rec"?"crec":f=="out"?"cout":"")+"' style='font-weight:400'>"+esc(v)+"</td>"}).join("")+"<td class='ro'>"+ra(q>0?o.val/q:0)+"</td><td class='ro'>"+f2(o.val)+"</td></tr>"}).join("");
 $("stb").innerHTML=h?h+"<tr><td colspan='11' style='text-align:right;font-weight:700;padding:6px 10px'>Total Value</td><td class='ro'>"+f2(tot)+"</td></tr>":"<tr><td colspan='12' style='padding:14px;color:var(--mu)'>No records found</td></tr>"}
/* ---- Return ---- */
function newRet(){return {date:today(),prod:"",person:"",dept:"",desig:"",qty:"",price:""}}
var rd=newRet();
function renderRet(){var d=rd;
 $("rf").innerHTML=fld("Date","<input class='in' type='date' value='"+esc(d.date)+"' onchange=\"rd.date=this.value\">")+
 fld("Product Name",ddH("prod",d.prod,"function(v){rd.prod=v;var b=baseFor(v);rd.price=b.qty>0?m2(b.val/b.qty):'';renderRet()}"))+
 fld("Person Name",ddH("person",d.person,"function(v){rd.person=v}"))+
 fld("Department",ddH("dept",d.dept,"function(v){rd.dept=v}"))+
 fld("Designation",ddH("desig",d.desig,"function(v){rd.desig=v}"))+
 fld("Quantity",numIn("rd.qty=this.value;updR()",d.qty))+
 fld("Unit Price",numIn("rd.price=this.value;updR()",d.price))+
 fld("Value",ro("r_val",f2(num(d.qty)*num(d.price))));
 $("rdf").value=rpf;renderRetPrev()}
function updR(){$("r_val").textContent=f2(num(rd.qty)*num(rd.price))}
function clrRet(){rd=newRet();renderRet()}
function addRet(){var d=rd;if(!d.prod||!d.date){alert("Please select date and Product Name");return}var q=num(d.qty),pr=num(d.price);if(q<=0){alert("Enter quantity");return}
 var n=Date.now(),val=m2(q*pr),sref=db.collection("stock").doc(sid(d.prod)),rref=db.collection("rows").doc("r"+n),tref=db.collection("returns").doc("t"+n),lr=lastRec(d.prod)||{};
 db.runTransaction(function(t){return t.get(sref).then(function(sn){var b=sn.exists?{qty:num(sn.data().qty),val:num(sn.data().val)}:baseFor(d.prod);
  var r=mkRow({date:d.date,cat:lr.cat,prod:d.prod,spc:lr.spc,person:d.person,dept:d.dept,desig:d.desig},b,q,0,n,val);r.ret=1;
  t.set(rref,r);t.set(tref,{n:n,date:d.date,prod:d.prod,person:d.person||"",dept:d.dept||"",desig:d.desig||"",qty:q,price:pr,value:val});
  t.set(sref,{prod:d.prod,qty:r.close,val:r.cv})})}).then(function(){rpf=d.date;rd=newRet();renderRet()}).catch(fail)}
function okRet(){var v=$("rdf").value;if(!v){alert("Please select a date");return}rpf=v;renderRetPrev()}
function allRet(){rpf="";renderRetPrev()}
function renderRetPrev(){var list=rets.filter(function(r){return !rpf||r.date===rpf}),t=0;
 $("rh").textContent="Preview — "+(rpf?"Date: "+rpf:"All returns")+" ("+list.length+")";
 $("rth").innerHTML=head(["SL No","Date","Product Name","Person Name","Department","Designation","Quantity","Unit Price","Value"]);
 var h=list.map(function(r,i){t+=num(r.value);return "<tr><td class='ro'>"+(i+1)+"</td>"+[r.date,r.prod,r.person,r.dept,r.desig,q3(r.qty),f2(r.price),f2(r.value)].map(function(v){return "<td class='ro' style='font-weight:400'>"+esc(v)+"</td>"}).join("")+"</tr>"}).join("");
 $("rtb").innerHTML=h?h+"<tr><td colspan='8' style='text-align:right;font-weight:700;padding:6px 10px'>Total Value</td><td class='ro'>"+f2(t)+"</td></tr>":"<tr><td colspan='9' style='padding:14px;color:var(--mu)'>No returns for this date</td></tr>"}
/* ---- Admin ---- */
function sess(v){try{if(v===undefined)return sessionStorage.getItem("adm")==="1";if(v)sessionStorage.setItem("adm","1");else sessionStorage.removeItem("adm")}catch(x){}return false}
function adminView(){var ok=adminOk&&isAdmin;$("agate").classList.toggle("hide",ok);$("adm").classList.toggle("hide",!ok);if(ok)admin();else $("aem").focus()}
function adminLogin(){var e=$("aem").value.trim(),p=$("apw").value;msg("");if(Object.prototype.hasOwnProperty.call(ADMIN_USERS,e.toLowerCase()))e=ADMIN_USERS[e.toLowerCase()];
 if(ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf(e.toLowerCase())<0){msg("Incorrect username or password");return}
 firebase.auth().signInWithEmailAndPassword(e,p).then(function(){sess(true);adminOk=true;isAdmin=true;$("apw").value="";go("adm")}).catch(function(){msg("Incorrect username or password")})}
function admin(){if(!isAdmin)return;var h=L.map(function(x){var k=x[0],a;
 if(k=="prod")a="<div class='add'><input class='in' id='i_prod' placeholder='Product name' style='flex:2 1 150px'><input class='in' id='i_pq' type='number' min='0' step='any' placeholder='Opening stock'><input class='in' id='i_pp' type='number' min='0' step='any' placeholder='Price'><button class='pri' onclick='addProd()'>Add</button></div>";
 else a="<div class='add'><input class='in' id='i_"+k+"' placeholder='Add new' onkeydown=\"if(event.key=='Enter')addI('"+k+"')\"><button class='pri' onclick=\"addI('"+k+"')\">Add</button></div>";
 return "<div class='card'><h3>"+x[1]+"</h3>"+a+lists[k].map(function(v,j){var s=k=="prod"&&stockMap[v]?" <small style='color:var(--mu)'>("+q3(stockMap[v].qty)+" / "+f2(stockMap[v].val)+")</small>":"";return "<div class='item'><span>"+esc(v)+s+"</span><button onclick=\"delI('"+k+"',"+j+")\">✕</button></div>"}).join("")+"</div>"}).join("");
 h+="<div class='card' style='grid-column:1/-1'><h3>Edit Records (Admin only)</h3><div class='add' style='margin-bottom:8px'><input class='in' type='date' id='aflt' value='"+aF+"' onchange='aF=this.value;renderAE()'><button onclick=\"aF='';$('aflt').value='';renderAE()\">All</button></div><div class='wrap'><table id='aet'></table></div></div>";
 $("adm").innerHTML=h;renderAE()}
function saveL(){var d={};L.forEach(function(x){d[x[0]]=lists[x[0]]});return db.collection("lists").doc("main").set(d).catch(fail)}
function addI(k){var v=$("i_"+k).value.trim();if(!v)return;if(lists[k].indexOf(v)<0)lists[k].push(v);saveL().then(admin)}
function delI(k,j){lists[k].splice(j,1);saveL().then(admin)}
function addProd(){var nm=$("i_prod").value.trim(),q=num($("i_pq").value),p=num($("i_pp").value);if(!nm){alert("Enter product name");return}
 if(lists.prod.indexOf(nm)<0)lists.prod.push(nm);var d={};L.forEach(function(x){d[x[0]]=lists[x[0]]});
 txn(nm,q,p,function(t){t.set(db.collection("lists").doc("main"),d)}).then(admin).catch(fail)}
function aCell(k,r,i){
 if(k=="date")return "<td><input class='in' type='date' value='"+esc(r.date)+"' onchange=\"achg("+i+",'date',this.value)\"></td>";
 if(k=="cat"||k=="spc"||k=="person"||k=="dept"||k=="desig")return "<td>"+ddH(k,r[k],"function(v){achg("+i+",'"+k+"',v)}")+"</td>";
 if(k=="prod")return "<td class='ro'>"+esc(r.prod)+"</td>";
 if(k=="rec"||k=="out")return "<td><input class='in' type='number' min='0' step='any' value='"+esc(r[k])+"' onchange=\"achg("+i+",'"+k+"',this.value)\"></td>";
 var v=val(r,k);return "<td class='ro' id='a"+k+i+"'>"+dsp(k,v)+"</td>"}
function renderAE(){var t=$("aet");if(!t||!isAdmin)return;var a=document.activeElement;if(a&&t.contains(a))return;
 var h="<thead>"+head(C.map(function(c){return c[1]}).concat([""]))+"</thead><tbody>";
 rows.forEach(function(r,i){if(aF&&r.date!==aF)return;h+="<tr><td class='ro'>"+(i+1)+"</td>"+C.slice(1).map(function(c){return aCell(c[0],r,i)}).join("")+"<td><button class='dg' onclick=\"delRow('"+r.id+"')\">✕</button></td></tr>"});
 t.innerHTML=h+"</tbody>"}
function rowData(r){var d={};for(var x in r)if(x!="id")d[x]=r[x];return d}
function achg(i,k,v){var r=rows[i],ref=db.collection("rows").doc(r.id);
 if(k=="rec"||k=="out"){var oc=num(r.close),ocv=cvv(r),oldRec=num(r.rec),ov=ovv(r),oup=num(r.open)>0?ov/num(r.open):0;
  var rv=rvv(r),ot=outvv(r);r.ov=ov;r[k]=num(v);
  if(k=="rec")rv=(r.ret&&oldRec>0)?m2(rv/oldRec*r.rec):m2(r.rec*oup);else ot=m2(r.out*oup);
  r.rv=rv;r.outv=ot;r.close=q3(num(r.open)+num(r.rec)-num(r.out));r.cv=m2(ov+rv-ot);
  txn(r.prod,r.close-oc,r.cv-ocv,function(t){t.set(ref,rowData(r))}).then(function(){["close","cup","cv","oup","ov"].forEach(function(f){var e=$("a"+f+i);if(e)e.textContent=dsp(f,val(r,f))})}).catch(fail)}
 else{r[k]=v;ref.set(rowData(r)).catch(fail)}}
function delRow(id){var r=rows.filter(function(x){return x.id===id})[0];if(!r||!confirm("Delete this record? The product stock will be adjusted back."))return;
 txn(r.prod,-(num(r.rec)-num(r.out)),-(rvv(r)-outvv(r)),function(t){t.delete(db.collection("rows").doc(id))}).catch(fail)}
/* ---- CSV ---- */
function csv(){var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
 var o=["Advanced Dental & Maxillofacial Hospital","House#39, Road#02, Dhanmondi, Dhaka-1205",C.map(function(c){return c[1]}).join(",")];
 rows.forEach(function(r,i){o.push(C.map(function(c){var v=c[0]=="sl"?i+1:val(r,c[0]);if(c[0]=="oup"||c[0]=="cup")v=ra(v);else if(MONEY[c[0]])v=f2(v);return q(v)}).join(","))});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+o.join("\n")],{type:"text/csv"}));a.download="stock-register.csv";a.click()}
/* ---- auth / data ---- */
function doLogin(){msg("");firebase.auth().signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){msg("Incorrect email or password")})}
$("pw").onkeydown=function(e){if(e.key=="Enter")doLogin()};
$("apw").onkeydown=function(e){if(e.key=="Enter")adminLogin()};
function stop(){unsubs.forEach(function(u){u()});unsubs=[]}
if(location.protocol==="file:"){msg("⚠ Login does not work when the file is opened directly from the phone/computer. Upload it to GitHub Pages and open the https:// link.");$("login").classList.add("hide")}
else if(typeof firebase==="undefined"){msg("⚠ Firebase failed to load — check your internet connection and refresh the page.");$("login").classList.add("hide")}
else if(firebaseConfig.apiKey==="YOUR_API_KEY"){msg("⚠ firebaseConfig is not set — paste your Firebase config near the top of the script.");$("login").classList.add("hide")}
else{
 firebase.initializeApp(firebaseConfig);db=firebase.firestore();
 firebase.auth().onAuthStateChanged(function(u){
  stop();
  if(!u){$("app").classList.add("hide");$("login").classList.remove("hide");rows=[];adminOk=false;sess(false);return}
  isAdmin=ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf((u.email||"").toLowerCase())>=0;adminOk=isAdmin&&sess();
  $("login").classList.add("hide");$("app").classList.remove("hide");msg("");go(curV=="adm"&&adminOk?"adm":"reg");
  unsubs.push(db.collection("lists").doc("main").onSnapshot(function(s){var v=s.exists?s.data():{};L.forEach(function(x){lists[x[0]]=v[x[0]]||[]});render()},fail));
  unsubs.push(db.collection("rows").orderBy("n").onSnapshot(function(s){rows=s.docs.map(function(x){var r=x.data();r.id=x.id;return r});render()},fail));
  unsubs.push(db.collection("stock").onSnapshot(function(s){stockMap={};s.docs.forEach(function(x){var v=x.data();if(v.prod)stockMap[v.prod]=v});if(curV=="reg"&&!($("ef").contains(document.activeElement)))renderEntry();if(curV=="adm"&&adminOk&&!$("adm").contains(document.activeElement))admin()},fail));
  unsubs.push(db.collection("returns").orderBy("n").onSnapshot(function(s){rets=s.docs.map(function(x){return x.data()});if(curV=="ret")renderRetPrev()},fail));
 });
}
