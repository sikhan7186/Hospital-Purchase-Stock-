<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><title>Purchase Stock Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!--
FIRESTORE RULES (Firebase Console > Firestore > Rules). অ্যাডমিন ইমেইল বসানো আছে:
rules_version = '2';
service cloud.firestore { match /databases/{d}/documents {
  function ok(){ return request.auth != null; }
  function adm(){ return request.auth != null && request.auth.token.email in ['emily1995jh@gmail.com']; }
  match /lists/{x}  { allow read: if ok(); allow write: if adm(); }
  match /rows/{x}   { allow read, create: if ok(); allow update, delete: if adm(); }
}}
-->
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--br:#d9dde3;--ac:#0f766e;--dg:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1e2328;--tx:#e8eaed;--mu:#9aa3ad;--br:#343b43;--ac:#2dd4bf;--dg:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Noto Sans Bengali",sans-serif}
header{padding:14px;text-align:center;background:var(--card);border-bottom:1px solid var(--br)}
header h1{margin:0;font-size:17px}header p{margin:2px 0 0;color:var(--mu);font-size:12px}
nav{display:flex;gap:8px;padding:10px;align-items:center;flex-wrap:wrap}nav .sp{flex:1}
button,.btn{border:1px solid var(--br);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
button.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dg{color:var(--dg)}
main{padding:0 10px 20px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wrap{overflow-x:auto;border:1px solid var(--br);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;min-width:1500px;width:100%}th,td{border-bottom:1px solid var(--br);padding:4px;white-space:nowrap}
th{background:var(--bg);font-size:12px;text-align:left}
td input,td select{width:100%;min-width:90px;padding:6px;border:1px solid var(--br);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
td.ro{font-weight:600;padding:4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:10px}.card h3{margin:0 0 8px;font-size:14px}
.add{display:flex;gap:6px}input.t{flex:1;padding:9px;border:1px solid var(--br);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--br)}
.item button{border:0;background:none;color:var(--dg);font-size:16px;padding:0 6px}
.login{max-width:340px;margin:40px auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--br);border-radius:10px}
.sum{margin-top:10px;text-align:right;font-weight:700}.hide{display:none!important}#msg{padding:10px 12px;color:var(--dg);font-size:14px;font-weight:600}
@media print{nav,.tools,.item button,.add{display:none}}
</style></head><body>
<header><h1>Advanced Dental &amp; Maxillofacial Hospital</h1><p>House#39, Road#02, Dhanmondi, Dhaka-1205</p><p><b>Purchase Department – Stock Register</b></p></header>
<div id="msg"></div>
<div id="login" class="login"><b>লগইন করুন</b><input class="t" id="em" type="email" placeholder="ইমেইল" autocomplete="username"><input class="t" id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"><button class="pri" onclick="doLogin()">প্রবেশ করুন</button></div>
<div id="app" class="hide">
<nav><button id="t1" class="on" onclick="tab(1)">স্টক রেজিস্টার</button><button id="t2" onclick="tab(2)">🔒 অ্যাডমিন প্যানেল</button><span class="sp"></span><button onclick="firebase.auth().signOut()">লগআউট</button></nav>
<main>
<section id="p1"><div class="tools"><button class="pri" onclick="toggleFind()">🔍 Find</button><button onclick="csv()">CSV এক্সপোর্ট</button><button onclick="window.print()">প্রিন্ট</button></div>
<div id="fp" class="card hide" style="margin-bottom:10px"><div class="add"><input class="t" type="date" id="fd"><button class="pri" onclick="okFind()">OK</button><button onclick="allFind()">সব</button></div></div>
<div class="wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<h3 id="ph" style="margin:14px 2px 8px;font-size:14px"></h3>
<div class="wrap"><table><thead id="pth"></thead><tbody id="ptb"></tbody></table></div><div class="sum" id="sum"></div></section>
<section id="p2" class="hide"><div id="agate" class="login"><b>🔒 অ্যাডমিন লগইন</b><input class="t" id="aem" type="email" placeholder="অ্যাডমিন ইমেইল" autocomplete="username"><input class="t" id="apw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"><button class="pri" onclick="adminLogin()">প্রবেশ করুন</button></div><div id="adm" class="grid hide"></div></section>
</main></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== আপনার Firebase কনফিগ এখানে বসান ====== */
var firebaseConfig={apiKey:"AIzaSyBxn9eC5vGk3mUk8Dk0Ro72T9D0LPPCHnk",authDomain:"love-birds-8698a.firebaseapp.com",projectId:"love-birds-8698a",storageBucket:"love-birds-8698a.firebasestorage.app",messagingSenderId:"80550108738",appId:"1:80550108738:web:b7754491c5417b546e97db"};
/* অ্যাডমিন ইমেইল (Firestore Rules এও একই ইমেইল দিন) */
var ADMIN_EMAILS=["emily1995jh@gmail.com"];
/* ============================================ */
var L=[["cat","Category"],["sub","Sub-Category"],["prod","Products Name"],["spc","SPC"],["open","Opening Stock"],["person","Person Name"],["desig","Designation"],["dept","Department"]];
var C=[["sl","SL. No"],["cat","Catagory","s"],["sub","Sub-Catagory","s"],["prod","Products Name","s"],["spc","SPC","s"],["open","Opening Stock","o"],["rec","Received","n"],["out","Out","n"],["person","Person Name","s"],["desig","Designation","s"],["dept","Department","s"],["date","Date","d"],["close","Closing Stock"],["price","Unit Price","n"],["total","Total Value"]];
var lists={},rows=[],isAdmin=false,adminOk=false,db,unsubs=[],dl;
L.forEach(function(x){lists[x[0]]=[]});
function $(i){return document.getElementById(i)}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function calc(r){r.close=num(r.open)+num(r.rec)-num(r.out);r.total=r.close*num(r.price)}
function msg(t){$("msg").textContent=t||""}
function fail(e){msg("সেভ হয়নি: "+(e&&e.code==="permission-denied"?"আপনার অনুমতি নেই":(e&&e.message)||"ত্রুটি"))}
function tab(n){$("p1").classList.toggle("hide",n!=1);$("p2").classList.toggle("hide",n!=2);$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)adminView()}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
var pdate=today(),aF="",draft;
function newDraft(){return {cat:"",sub:"",prod:"",spc:"",open:"",rec:"",out:"",person:"",desig:"",dept:"",date:today(),price:"",close:0,total:0}}
draft=newDraft();
function busy(){var a=document.activeElement;return a&&$("tb").contains(a)}
function opts(k,v){var o="<option value=''>--</option>"+lists[k].map(function(x){return "<option"+(x==v?" selected":"")+">"+esc(x)+"</option>"}).join("");if(v&&lists[k].indexOf(v)<0)o+="<option selected>"+esc(v)+"</option>";return o}
function cell(c,r,h,id){var k=c[0],t=c[2],a="oninput=\""+h+"'"+k+"',this.value,0)\" onchange=\""+h+"'"+k+"',this.value,1)\"";
 if(k=="close")return "<td class='ro' id='c"+id+"'>"+r.close+"</td>";
 if(k=="total")return "<td class='ro' id='v"+id+"'>"+(r.total||0).toFixed(2)+"</td>";
 if(t=="s")return "<td><select onchange=\""+h+"'"+k+"',this.value,1)\">"+opts(k,r[k])+"</select></td>";
 if(t=="o")return "<td><input type='number' list='dl_open' value='"+esc(r[k])+"' "+a+"></td>";
 if(t=="d")return "<td><input type='date' value='"+esc(r[k])+"' onchange=\""+h+"'"+k+"',this.value,1)\"></td>";
 return "<td><input type='number' min='0' step='any' value='"+esc(r[k])+"' "+a+"></td>"}
function head(x){return "<tr>"+C.map(function(c){return "<th>"+c[1]+"</th>"}).join("")+(x||"")+"</tr>"}
function renderEntry(){$("th").innerHTML=head("<th></th><th></th>");
 $("tb").innerHTML="<tr><td class='ro' id='dsl'>"+(rows.length+1)+"</td>"+C.slice(1).map(function(c){return cell(c,draft,"dchg(","d")}).join("")+"<td><button class='pri' onclick='addRec()'>Add</button></td><td><button class='dg' onclick='clrDraft()'>✕</button></td></tr>";
 if(!dl){dl=document.createElement("datalist");dl.id="dl_open";document.body.appendChild(dl)}
 dl.innerHTML=lists.open.map(function(x){return "<option value='"+esc(x)+"'>"}).join("")}
function dchg(k,v){draft[k]=v;calc(draft);$("cd").textContent=draft.close;$("vd").textContent=draft.total.toFixed(2)}
function clrDraft(){draft=newDraft();renderEntry()}
function addRec(){if(!draft.prod){alert("Products Name সিলেক্ট করুন");return}if(!draft.date){alert("তারিখ দিন");return}
 var n=Date.now(),d={};for(var x in draft)d[x]=draft[x];d.n=n;
 db.collection("rows").doc("r"+n).set(d).then(function(){pdate=d.date;draft=newDraft();renderEntry();renderPrev()}).catch(fail)}
function renderPrev(){var list=[],t=0;rows.forEach(function(r,i){if(!pdate||r.date===pdate){list.push([r,i]);t+=r.total||0}});
 $("ph").textContent="প্রিভিউ — "+(pdate?"তারিখ: "+pdate:"সব তথ্য")+" ("+list.length+"টি)";
 $("pth").innerHTML=head();
 $("ptb").innerHTML=list.map(function(p){var r=p[0];return "<tr><td class='ro'>"+(p[1]+1)+"</td>"+C.slice(1).map(function(c){var v=r[c[0]];if(c[0]=="total")v=(v||0).toFixed(2);return "<td class='ro' style='font-weight:400'>"+esc(v)+"</td>"}).join("")+"</tr>"}).join("")||"<tr><td colspan='15' style='padding:14px;color:var(--mu)'>এই তারিখে কোনো তথ্য নেই</td></tr>";
 $("sum").textContent="মোট ভ্যালু: "+t.toFixed(2)}
function render(){renderPrev();if(!busy())renderEntry();else if($("dsl"))$("dsl").textContent=rows.length+1;renderAE()}
function toggleFind(){$("fd").value=pdate||today();$("fp").classList.toggle("hide")}
function okFind(){var v=$("fd").value;if(!v){alert("তারিখ সিলেক্ট করুন");return}pdate=v;$("fp").classList.add("hide");renderPrev()}
function allFind(){pdate="";$("fp").classList.add("hide");renderPrev()}
function renderAE(){var t=$("aet");if(!t||!isAdmin)return;var a=document.activeElement;if(a&&t.contains(a))return;
 var h="<thead>"+head("<th></th>")+"</thead><tbody>";
 rows.forEach(function(r,i){if(aF&&r.date!==aF)return;h+="<tr><td class='ro'>"+(i+1)+"</td>"+C.slice(1).map(function(c){return cell(c,r,"achg("+i+",",i)}).join("")+"<td><button class='dg' onclick=\"delRow('"+r.id+"')\">✕</button></td></tr>"});
 t.innerHTML=h+"</tbody>"}
function achg(i,k,v,save){var r=rows[i];r[k]=v;calc(r);$("c"+i).textContent=r.close;$("v"+i).textContent=r.total.toFixed(2);if(save){var d={};for(var x in r)if(x!="id")d[x]=r[x];db.collection("rows").doc(r.id).set(d).catch(fail)}}
function delRow(id){if(confirm("এই রেকর্ড মুছবেন?"))db.collection("rows").doc(id).delete().catch(fail)}
function admin(){if(!isAdmin)return;var h=L.map(function(x){var k=x[0];
 return "<div class='card'><h3>"+x[1]+"</h3><div class='add'><input class='t' id='i_"+k+"' placeholder='নতুন যোগ করুন' onkeydown=\"if(event.key=='Enter')addI('"+k+"')\"><button class='pri' onclick=\"addI('"+k+"')\">Add</button></div>"+
 lists[k].map(function(v,j){return "<div class='item'><span>"+esc(v)+"</span><button onclick=\"delI('"+k+"',"+j+")\">✕</button></div>"}).join("")+"</div>"}).join("");
 h+="<div class='card' style='grid-column:1/-1'><h3>রেকর্ড এডিট (শুধু অ্যাডমিন)</h3><div class='add' style='margin-bottom:8px'><input class='t' type='date' id='aflt' value='"+aF+"' onchange='aF=this.value;renderAE()'><button onclick=\"aF='';$('aflt').value='';renderAE()\">সব</button></div><div class='wrap'><table id='aet'></table></div></div>";
 $("adm").innerHTML=h;renderAE()}
function saveL(){var d={};L.forEach(function(x){d[x[0]]=lists[x[0]]});return db.collection("lists").doc("main").set(d).catch(fail)}
function addI(k){var v=$("i_"+k).value.trim();if(!v)return;if(lists[k].indexOf(v)<0)lists[k].push(v);saveL().then(admin)}
function delI(k,j){lists[k].splice(j,1);saveL().then(admin)}
function csv(){var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
 var o=["Advanced Dental & Maxillofacial Hospital","House#39, Road#02, Dhanmondi, Dhaka-1205",C.map(function(c){return c[1]}).join(",")];
 rows.forEach(function(r,i){o.push(C.map(function(c){return q(c[0]=="sl"?i+1:r[c[0]])}).join(","))});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+o.join("\n")],{type:"text/csv"}));a.download="stock-register.csv";a.click()}
function doLogin(){msg("");firebase.auth().signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){msg("ইমেইল বা পাসওয়ার্ড ভুল")})}
$("pw").onkeydown=function(e){if(e.key=="Enter")doLogin()};
function adminView(){var ok=adminOk&&isAdmin;$("agate").classList.toggle("hide",ok);$("adm").classList.toggle("hide",!ok);if(ok)admin();else $("aem").focus()}
function adminLogin(){var e=$("aem").value.trim(),p=$("apw").value;msg("");
 if(ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf(e.toLowerCase())<0){msg("এই ইমেইলে অ্যাডমিন অনুমতি নেই");return}
 firebase.auth().signInWithEmailAndPassword(e,p).then(function(){adminOk=true;isAdmin=true;$("apw").value="";tab(2)}).catch(function(){msg("ইমেইল বা পাসওয়ার্ড ভুল")})}
$("apw").onkeydown=function(e){if(e.key=="Enter")adminLogin()};
function stop(){unsubs.forEach(function(u){u()});unsubs=[]}
if(location.protocol==="file:"){msg("⚠ ফাইলটি সরাসরি ফোন/কম্পিউটার থেকে খুললে লগইন কাজ করে না। GitHub Pages-এ আপলোড করে তার https:// লিংক থেকে খুলুন।");$("login").classList.add("hide")}
else if(typeof firebase==="undefined"){msg("⚠ Firebase লোড হয়নি — ইন্টারনেট চেক করে পেজ রিফ্রেশ করুন।");$("login").classList.add("hide")}
else if(firebaseConfig.apiKey==="YOUR_API_KEY"){msg("⚠ firebaseConfig বসানো হয়নি — ফাইলের উপরের অংশে আপনার Firebase কনফিগ দিন।");$("login").classList.add("hide")}
else{
 firebase.initializeApp(firebaseConfig);db=firebase.firestore();
 firebase.auth().onAuthStateChanged(function(u){
  stop();
  if(!u){$("app").classList.add("hide");$("login").classList.remove("hide");rows=[];adminOk=false;return}
  var was=adminOk;isAdmin=ADMIN_EMAILS.map(function(x){return x.toLowerCase()}).indexOf((u.email||"").toLowerCase())>=0;
  $("login").classList.add("hide");$("app").classList.remove("hide");adminOk=isAdmin;tab(was&&isAdmin?2:1);msg("");
  unsubs.push(db.collection("lists").doc("main").onSnapshot(function(s){var v=s.exists?s.data():{};L.forEach(function(x){lists[x[0]]=v[x[0]]||[]});render()},fail));
  unsubs.push(db.collection("rows").orderBy("n").onSnapshot(function(s){rows=s.docs.map(function(x){var r=x.data();r.id=x.id;return r});render()},fail));
 });
}
</script></body></html>
